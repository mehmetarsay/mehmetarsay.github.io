<style>
  :root {
    --felt: #127A52;
    --felt-shade: #083D29;
    --felt-deep: #05261B;
    --ivory: #FFFDF5;
    --ivory-shade: #EBE2CD;
    --red: #CB202E;
    --yellow: #FAC733;
    --mint: #E9FBF1;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem calc(2.5rem + env(safe-area-inset-bottom));
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--mint);
    background: radial-gradient(125% 95% at 50% -10%, #168A5C 0%, var(--felt-shade) 48%, var(--felt-deep) 78%, #03170F 100%);
    background-attachment: fixed;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Tarama alanı: sayfanın arkasında, tıklamayı yutmaz. */
  #field {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .9s ease;
  }
  #field.on { opacity: 1; }
  /* Kenar kararması — alan ortada toplanmış görünsün. */
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(115% 85% at 50% 45%, transparent 38%, rgba(3, 20, 13, .55) 100%);
  }
  main { position: relative; z-index: 2; width: 100%; max-width: 27rem; text-align: center; }

  .card {
    position: relative;
    padding: 2.3rem 1.9rem 2.1rem;
    border-radius: 30px;
    background: linear-gradient(168deg, rgba(20, 128, 87, .34), rgba(4, 30, 21, .66));
    border: 1px solid rgba(233, 251, 241, .14);
    box-shadow: 0 34px 90px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 253, 245, .16);
    overflow: hidden;
  }
  @supports (backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px)) {
    .card {
      background: linear-gradient(168deg, rgba(20, 128, 87, .26), rgba(4, 30, 21, .5));
      -webkit-backdrop-filter: blur(16px) saturate(135%);
      backdrop-filter: blur(16px) saturate(135%);
    }
  }
  /* İmleç kartın üstündeyken camda gezinen parıltı. */
  .card::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(240px 240px at var(--mx, 50%) var(--my, 0%), rgba(250, 199, 51, .16), transparent 68%);
    opacity: var(--sheen, 0);
    transition: opacity .4s ease;
  }
  .card:hover { --sheen: 1; }

  .iconwrap { position: relative; width: 112px; height: 112px; margin: 0 auto 1.35rem; }
  .iconwrap::before {
    content: ''; position: absolute; inset: -15px;
    border-radius: 36px; border: 1px solid rgba(250, 199, 51, .38);
    animation: ring 3.6s ease-in-out infinite;
  }
  .icon {
    position: relative;
    width: 112px; height: 112px;
    border-radius: 26px; display: block;
    box-shadow: 0 18px 46px rgba(0, 0, 0, .5);
  }
  /* Simgenin üstünden geçen tarama çizgisi — köşeleri taşmasın diye
     kutu değil, arka plan konumu kayıyor. */
  .iconwrap::after {
    content: ''; position: absolute; inset: 0; border-radius: 26px; pointer-events: none;
    background: linear-gradient(180deg, transparent 40%, rgba(255, 253, 245, .3) 50%, transparent 60%);
    background-size: 100% 300%;
    mix-blend-mode: screen;
    animation: sweep 4.4s linear infinite;
  }
  @keyframes ring { 0%, 100% { transform: scale(.955); opacity: .22; } 50% { transform: scale(1.045); opacity: .68; } }
  @keyframes sweep { 0% { background-position: 0 -150%; } 100% { background-position: 0 150%; } }

  h1 {
    margin: 0 0 .2rem;
    font-size: 2.15rem; font-weight: 700; letter-spacing: -.025em;
    color: var(--ivory);
  }
  .sub { margin: 0 0 .4rem; font-size: 1rem; font-weight: 600; color: var(--yellow); }
  .pitch { margin: 0 auto 1.9rem; max-width: 22rem; color: rgba(233, 251, 241, .82); }
  .stores { display: flex; flex-direction: column; gap: .7rem; }
  a.btn {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .95rem 1.1rem;
    border-radius: 15px;
    font-size: 1.02rem; font-weight: 600;
    text-decoration: none;
    background: linear-gradient(180deg, var(--ivory), #F3ECDC);
    color: #0d2a1e;
    border: 1px solid var(--ivory-shade);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0, 0, 0, .38), 0 0 0 4px rgba(250, 199, 51, .16); }
  a.btn:active { transform: translateY(0); }
  a.btn:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
  a.btn svg { width: 22px; height: 22px; flex: none; }

  .hint {
    margin: 1.3rem 0 0;
    font: 600 .68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: rgba(233, 251, 241, .42);
    transition: opacity .6s ease;
  }
  .hint b { display: inline-block; width: 6px; height: 6px; margin-right: .5em; border-radius: 50%; background: var(--yellow); vertical-align: middle; animation: blip 1.7s ease-in-out infinite; }
  .hint.gone { opacity: 0; }
  @keyframes blip { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

  footer { margin-top: 1.5rem; font-size: .82rem; color: rgba(233, 251, 241, .5); }
  footer a { color: rgba(233, 251, 241, .72); }
  footer a:hover { color: var(--ivory); }

  @media (max-width: 480px) {
    .card { padding: 1.9rem 1.4rem 1.7rem; border-radius: 26px; }
    h1 { font-size: 1.9rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    a.btn, .card::after, #field { transition: none; }
    .iconwrap::before, .iconwrap::after, .hint b { animation: none; }
    .iconwrap::after { display: none; }
  }
</style>

<script>
/* ============================================================================
   TARAMA ALANI — sayfanın arkasındaki tek görsellik alan.
   Sayfada bir tane görsel var: uygulamanın kendi simgesi. Onu piksel piksel
   okuyup toza dağıtıyoruz; imleç bir mercek gibi geziyor ve değdiği yerde toz
   yerine oturup simgeyi kuruyor. Uygulamanın yaptığı işin aynısı: karışıklık
   girer, tanınmış taş çıkar.
   Ayrı dosya yok, ayrı istek yok — her şey <img> içindeki base64'ten türüyor.
   ========================================================================== */
(function () {
  'use strict';

  var cv = document.getElementById('field');
  var img = document.getElementById('appicon');
  var hint = document.getElementById('hint');
  var card = document.getElementById('card');
  if (!cv || !cv.getContext || !img) return;
  var ctx = cv.getContext('2d');
  if (!ctx) return;

  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  var reduce = !!(reduceMQ && reduceMQ.matches);
  var coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

  /* Simgenin palet karşılıkları. Her noktaya en yakın olan atanıyor; böylece
     çizim sırasında renk sayısı sekizle sınırlı kalıyor. */
  var PAL = [
    [255, 253, 245], [235, 226, 205], [203, 32, 46], [250, 199, 51],
    [167, 152, 134], [24, 138, 94], [11, 77, 51], [6, 42, 30]
  ];
  var DUST = ['rgba(255,253,245,.30)', 'rgba(235,226,205,.26)', 'rgba(203,32,46,.34)', 'rgba(250,199,51,.34)',
              'rgba(167,152,134,.24)', 'rgba(24,138,94,.30)', 'rgba(11,77,51,.30)', 'rgba(6,42,30,.28)'];
  var SPR = [];

  /* Okey taşları: dört renk, on üç sayı. Alanın en arkasında duran,
     kendi hâlinde süzülen sessiz katman. */
  var TCOL = ['#C8202E', '#1D1A16', '#1F5FBF', '#D2A01C'];
  var TSPR = [], TILES = [];

  var W = 0, H = 0, DPR = 1;
  var pts = null, insts = [], n = 0;
  var PX, PY, VX, VY, HX, HY, SX, SY, PH, DR, SZ, WT, PR, CI, IN, ORDER;
  var FX, FY, FF, FC;
  var POX, POY;
  var quality = 1;

  var lens = { x: -9999, y: -9999, tx: -9999, ty: -9999, r: 215, pow: 0 };
  var pointerAt = -1e9, travel = 0, lastPX = 0, lastPY = 0;
  var waves = [];
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
  var raf = 0, last = 0, ema = 16, slow = 0;

  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function sstep(e0, e1, x) { var t = (x - e0) / (e1 - e0); t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }

  /* ---- 1. Simgeyi oku ---------------------------------------------------- */
  function nearest(r, g, b) {
    var best = 0, bd = 1e9;
    for (var i = 0; i < PAL.length; i++) {
      var p = PAL[i], dr = r - p[0], dg = g - p[1], db = b - p[2];
      var d = dr * dr + dg * dg + db * db;
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  }

  function sampleIcon() {
    var S = img.naturalWidth || 192;
    if (!S) return null;
    var off = document.createElement('canvas');
    off.width = S; off.height = S;
    var o = off.getContext('2d');
    if (!o) return null;
    o.drawImage(img, 0, 0, S, S);
    var d;
    try { d = o.getImageData(0, 0, S, S).data; } catch (e) { return null; }

    var step = Math.max(2, Math.round(S / 64));
    var out = [], green = 0;
    for (var y = 0; y < S; y += step) {
      for (var x = 0; x < S; x += step) {
        var i = (y * S + x) * 4, r = d[i], g = d[i + 1], b = d[i + 2];
        if (d[i + 3] < 24) continue;
        /* Çuha yeşili zeminin tamamını taşımak kareyi lekeye çevirirdi:
           zeminden dokuzda bir nokta alınıyor, geri kalanı köşe ayraçları,
           taş, rakam ve nokta — yani simgeyi simge yapan yerler. */
        var isBg = g > r * 1.25 && g > b * 1.25;
        if (isBg) { green++; if (green % 9) continue; }
        out.push({
          u: (x + step * .5) / S - .5,
          v: (y + step * .5) / S - .5,
          c: nearest(r, g, b),
          w: isBg ? .4 : 1
        });
      }
    }
    for (var k = out.length - 1; k > 0; k--) {   /* karıştır: her kopya farklı alt küme kullansın */
      var j = (Math.random() * (k + 1)) | 0, tmp = out[k]; out[k] = out[j]; out[j] = tmp;
    }
    return out.length ? out : null;
  }

  /* Odaktaki noktalar sert kare değil, yumuşak ışık olsun diye renk başına
     bir kez çizilen küçük damga. */
  function makeSprites() {
    SPR = [];
    for (var i = 0; i < PAL.length; i++) {
      var c = document.createElement('canvas');
      c.width = c.height = 32;
      var g = c.getContext('2d');
      var p = PAL[i], rgb = p[0] + ',' + p[1] + ',' + p[2];
      var gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      gr.addColorStop(0, 'rgba(' + rgb + ',.92)');
      gr.addColorStop(.32, 'rgba(' + rgb + ',.55)');
      gr.addColorStop(.72, 'rgba(' + rgb + ',.12)');
      gr.addColorStop(1, 'rgba(' + rgb + ',0)');
      g.fillStyle = gr;
      g.fillRect(0, 0, 32, 32);
      SPR.push(c);
    }
  }

  function roundPath(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /* Taşlar her karede yeniden çizilmiyor: on altı tanesi bir kez büyük
     boyda basılıyor, sonra küçültülerek kopyalanıyor. */
  function makeTileSprites() {
    TSPR = [];
    var HT = 170, WD = Math.round(HT * .68);
    for (var i = 0; i < 16; i++) {
      var num = 1 + ((Math.random() * 13) | 0);
      var col = TCOL[(Math.random() * TCOL.length) | 0];
      var c = document.createElement('canvas');
      c.width = WD; c.height = HT;
      var g = c.getContext('2d');
      if (!g) continue;
      var gr = g.createLinearGradient(0, 0, 0, HT);
      gr.addColorStop(0, '#F7F0DE'); gr.addColorStop(1, '#DAD0B9');
      g.fillStyle = gr;
      roundPath(g, 1.5, 1.5, WD - 3, HT - 3, 15); g.fill();
      g.strokeStyle = 'rgba(38,28,18,.20)'; g.lineWidth = 2; g.stroke();
      /* Üstten inen ışık: bant değil, taşın içine sızan yumuşak geçiş. */
      g.save();
      roundPath(g, 1.5, 1.5, WD - 3, HT - 3, 15); g.clip();
      var sh = g.createLinearGradient(0, 0, 0, HT * .62);
      sh.addColorStop(0, 'rgba(255,255,255,.42)');
      sh.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = sh; g.fillRect(0, 0, WD, HT * .62);
      var bt = g.createLinearGradient(0, HT * .62, 0, HT);
      bt.addColorStop(0, 'rgba(70,52,32,0)');
      bt.addColorStop(1, 'rgba(70,52,32,.16)');
      g.fillStyle = bt; g.fillRect(0, HT * .62, WD, HT * .38);
      g.restore();
      g.fillStyle = col;
      g.font = '700 ' + Math.round(HT * .46) + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(num), WD * .5, HT * .43);
      g.fillStyle = 'rgba(58,44,28,.34)';
      g.beginPath(); g.arc(WD * .5, HT * .77, HT * .043, 0, 6.2832); g.fill();
      TSPR.push(c);
    }
  }

  /* ---- 2. Alanı kur ------------------------------------------------------ */
  function build() {
    var small = W < 720 || H < 560;
    var count = clamp(Math.round(W * H / 120000), 5, 18);
    var cols = Math.max(1, Math.round(Math.sqrt(count * W / Math.max(H, 1))));
    var rows = Math.max(1, Math.ceil(count / cols));
    var cw = W / cols, ch = H / rows;

    insts = [];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var s = clamp(Math.min(cw, ch) * (.54 + Math.random() * .26), 116, 300);
        insts.push({
          x: (c + .5) * cw + (Math.random() - .5) * cw * .32,
          y: (r + .5) * ch + (Math.random() - .5) * ch * .32,
          s: s,
          rot: (Math.random() - .5) * .5,
          dep: .55 + Math.random() * .5,
          seed: Math.random(),
          score: 0, conf: 0
        });
      }
    }

    var budget = small ? 2400 : 6400;
    var per = clamp(Math.floor(budget / insts.length), 170, 780);
    per = Math.min(per, pts.length);
    n = insts.length * per;

    PX = new Float32Array(n); PY = new Float32Array(n);
    VX = new Float32Array(n); VY = new Float32Array(n);
    HX = new Float32Array(n); HY = new Float32Array(n);
    SX = new Float32Array(n); SY = new Float32Array(n);
    PH = new Float32Array(n); DR = new Float32Array(n);
    SZ = new Float32Array(n); WT = new Float32Array(n); PR = new Float32Array(n);
    CI = new Uint8Array(n); IN = new Uint8Array(n);
    FX = new Float32Array(n); FY = new Float32Array(n); FF = new Float32Array(n); FC = new Uint8Array(n);
    POX = new Float32Array(insts.length); POY = new Float32Array(insts.length);

    var spread = Math.max(cw, ch) * .78;
    var k = 0, off = 0;
    for (var ii = 0; ii < insts.length; ii++) {
      var I = insts[ii], co = Math.cos(I.rot), si = Math.sin(I.rot);
      for (var j = 0; j < per; j++) {
        var p = pts[(off + j) % pts.length];
        var lx = p.u * I.s, ly = p.v * I.s;
        HX[k] = I.x + lx * co - ly * si;
        HY[k] = I.y + lx * si + ly * co;
        var a = Math.random() * 6.2832, rr = Math.sqrt(Math.random()) * spread;
        SX[k] = clamp(I.x + Math.cos(a) * rr, -40, W + 40);
        SY[k] = clamp(I.y + Math.sin(a) * rr, -40, H + 40);
        PX[k] = SX[k]; PY[k] = SY[k]; VX[k] = 0; VY[k] = 0;
        PH[k] = Math.random() * 6.2832;
        DR[k] = 5 + Math.random() * 14;
        SZ[k] = (.85 + Math.random() * 1.05) * (.72 + I.dep * .55);
        WT[k] = p.w; CI[k] = p.c; IN[k] = ii; PR[k] = Math.random();
        k++;
      }
      off += per;
    }

    /* Çizim sırası renge göre sabitleniyor: her karede fillStyle sekiz kez
       değişiyor, nokta başına bir kez değil. */
    var bins = [];
    for (var b = 0; b < PAL.length; b++) bins.push([]);
    for (var q = 0; q < n; q++) bins[CI[q]].push(q);
    ORDER = new Int32Array(n);
    var w = 0;
    for (var b2 = 0; b2 < bins.length; b2++) {
      for (var z = 0; z < bins[b2].length; z++) ORDER[w++] = bins[b2][z];
    }

    lens.r = clamp(Math.min(W, H) * .28, 140, 260);

    /* Taşlar: seyrek, dağınık, birbirine değmeyecek kadar aralıklı. */
    var tn = clamp(Math.round(W * H / 95000), 6, 22);
    var tc = Math.max(1, Math.round(Math.sqrt(tn * W / Math.max(H, 1))));
    var tr = Math.max(1, Math.ceil(tn / tc));
    var tw = W / tc, th = H / tr;
    TILES = [];
    for (var y2 = 0; y2 < tr; y2++) {
      for (var x2 = 0; x2 < tc; x2++) {
        TILES.push({
          x: (x2 + .5) * tw + (Math.random() - .5) * tw * .5,
          y: (y2 + .5) * th + (Math.random() - .5) * th * .5,
          h: 44 + Math.random() * 34,
          rot: (Math.random() - .5) * .75,
          dep: .4 + Math.random() * .6,
          ph: Math.random() * 6.2832,
          sp: (Math.random() * TSPR.length) | 0
        });
      }
    }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth || window.innerWidth;
    H = cv.clientHeight || window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    build();
    if (lens.tx < -1000) { lens.tx = lens.x = W * .5; lens.ty = lens.y = H * .42; }
  }

  /* ---- 3. Dalga: tıklayınca alanı baştan başa geçen tanıma halkası ------- */
  function wave(x, y, speed, life) {
    if (waves.length > 3) waves.shift();
    waves.push({ x: x, y: y, t: now(), sp: speed || .78, life: life || 1700 });
  }

  /* ---- 4. Kare ----------------------------------------------------------- */
  function frame(ts) {
    raf = requestAnimationFrame(frame);
    var dt = last ? ts - last : 16; last = ts;
    ema += (clamp(dt, 4, 80) - ema) * .1;
    if (ema > 26) { if (++slow > 45) { quality = Math.max(.45, quality - .18); slow = 0; } }
    else if (ema < 18 && quality < 1) { if (++slow > 120) { quality = Math.min(1, quality + .1); slow = 0; } }
    else slow = 0;

    var t = (ts - t0) / 1000;

    /* Mercek: imleç yoksa kendi kendine geziyor, gelince yumuşak devralıyor. */
    if (ts - pointerAt > 2400) {
      var s = t * .22;
      lens.tx = W * (.5 + .34 * Math.sin(s) * Math.cos(s * .37));
      lens.ty = H * (.5 + .3 * Math.sin(s * .81 + 1.1));
    }
    lens.x += (lens.tx - lens.x) * (ts - pointerAt > 2400 ? .05 : .17);
    lens.y += (lens.ty - lens.y) * (ts - pointerAt > 2400 ? .05 : .17);
    lens.pow += (1 - lens.pow) * .04;

    var R = lens.r, R2 = R * R, lx = lens.x, ly = lens.y;

    /* Derinlik: alan imlecin tersine birkaç piksel kayıyor. */
    var pxn = (lx / W - .5), pyn = (ly / H - .5);
    for (var ii = 0; ii < insts.length; ii++) {
      POX[ii] = -pxn * 26 * insts[ii].dep;
      POY[ii] = -pyn * 18 * insts[ii].dep;
      insts[ii].score = 0;
    }

    /* Dalgaları güncelle */
    var wv = [], tn = now();
    for (var wi = 0; wi < waves.length; wi++) {
      var ww = waves[wi], age = tn - ww.t;
      if (age > ww.life) continue;
      wv.push({ x: ww.x, y: ww.y, r: age * ww.sp, a: 1 - age / ww.life });
    }
    waves = waves.filter(function (q) { return tn - q.t <= q.life; });

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    tilesDraw(t, lx, ly, wv);

    var fi = 0, curC = -1;
    ctx.fillStyle = DUST[0];
    for (var k = 0; k < n; k++) {
      var i = ORDER[k];
      if (PR[i] > quality) continue;
      var ins = IN[i];
      var hx = HX[i] + POX[ins], hy = HY[i] + POY[ins];

      var f = 0;
      var dx = hx - lx, dy = hy - ly, d2 = dx * dx + dy * dy;
      if (d2 < R2) f = sstep(R, R * .24, Math.sqrt(d2)) * lens.pow;
      for (var q2 = 0; q2 < wv.length; q2++) {
        var g = wv[q2], gd = Math.sqrt((hx - g.x) * (hx - g.x) + (hy - g.y) * (hy - g.y)) - g.r;
        var gv = Math.exp(-(gd * gd) / 5200) * g.a;
        if (gv > f) f = gv;
      }

      var sxx = SX[i] + POX[ins] + Math.sin(t * .27 + PH[i]) * DR[i];
      var syy = SY[i] + POY[ins] + Math.cos(t * .23 + PH[i] * 1.4) * DR[i];
      var tx = sxx + (hx - sxx) * f, ty = syy + (hy - syy) * f;
      if (f > .02) {                      /* mercek hafifçe büyütsün */
        var m = 1 + .12 * f;
        tx = lx + (tx - lx) * m; ty = ly + (ty - ly) * m;
      }
      var kk = .011 + .115 * f, dp = .915 - .105 * f;
      VX[i] = (VX[i] + (tx - PX[i]) * kk) * dp; PX[i] += VX[i];
      VY[i] = (VY[i] + (ty - PY[i]) * kk) * dp; PY[i] += VY[i];

      if (CI[i] !== curC) { curC = CI[i]; ctx.fillStyle = DUST[curC]; }
      var sz = SZ[i];
      ctx.fillRect(PX[i] - sz * .5, PY[i] - sz * .5, sz, sz);

      if (f > .05) {
        FX[fi] = PX[i]; FY[fi] = PY[i]; FF[fi] = f * WT[i]; FC[fi] = CI[i]; fi++;
        var I2 = insts[ins]; if (f > I2.score) I2.score = f;
      }
    }

    /* Odak katmanı: toplayıcı kipte, üst üste binen noktalar parlasın. */
    ctx.globalCompositeOperation = 'lighter';
    for (var j2 = 0; j2 < fi; j2++) {
      var a2 = FF[j2];
      if (a2 < .03) continue;
      ctx.globalAlpha = Math.min(1, a2 * .62);
      var ss = 3 + a2 * 7.5;
      ctx.drawImage(SPR[FC[j2]], FX[j2] - ss * .5, FY[j2] - ss * .5, ss, ss);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    boxes(t);
    reticle(t);
    hud(fi);
  }

  /* Taş katmanı: tozun altında kalıyor, temel saydamlığı düşük. Mercek
     yaklaşınca ya da tanıma halkası üstünden geçince biraz beliriyor —
     o kadar; öne çıkmıyor. */
  function tilesDraw(t, lx, ly, wv) {
    if (!TSPR.length) return;
    var R = lens.r * 1.35;
    for (var i = 0; i < TILES.length; i++) {
      var T = TILES[i];
      var x = T.x - (lx / W - .5) * 34 * T.dep + Math.sin(t * .17 + T.ph) * 9;
      var y = T.y - (ly / H - .5) * 22 * T.dep + Math.cos(t * .14 + T.ph * 1.3) * 7;
      var dx = x - lx, dy = y - ly;
      var near = sstep(R, R * .25, Math.sqrt(dx * dx + dy * dy)) * lens.pow;
      for (var q = 0; q < wv.length; q++) {
        var g = wv[q], gd = Math.sqrt((x - g.x) * (x - g.x) + (y - g.y) * (y - g.y)) - g.r;
        var gv = Math.exp(-(gd * gd) / 9000) * g.a;
        if (gv > near) near = gv;
      }
      var a = (.075 + .045 * T.dep) * (1 + near * 1.7);
      var h = T.h, w = h * .68;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(x, y);
      ctx.rotate(T.rot + Math.sin(t * .2 + T.ph) * .04);
      ctx.drawImage(TSPR[T.sp], -w * .5, -h * .5, w, h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- 5. Kilitlenen taşın kutusu --------------------------------------- */
  function boxes(t) {
    ctx.lineCap = 'round';
    for (var i = 0; i < insts.length; i++) {
      var I = insts[i];
      var target = I.score;
      I.conf += (target - I.conf) * .14;
      var a = sstep(.34, .66, I.conf);
      if (a < .02) continue;

      var x = I.x + POX[i], y = I.y + POY[i], h = I.s * .56;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(I.rot);
      ctx.strokeStyle = 'rgba(250,199,51,' + (a * .95).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      var L = h * (.24 + .16 * a);
      var cs = [[-h, -h, 1, 1], [h, -h, -1, 1], [h, h, -1, -1], [-h, h, 1, -1]];
      ctx.beginPath();
      for (var c = 0; c < 4; c++) {
        var p = cs[c];
        ctx.moveTo(p[0] + p[2] * L, p[1]);
        ctx.lineTo(p[0], p[1]);
        ctx.lineTo(p[0], p[1] + p[3] * L);
      }
      ctx.stroke();
      ctx.strokeStyle = 'rgba(233,251,241,' + (a * .16).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.strokeRect(-h, -h, h * 2, h * 2);
      ctx.restore();

      /* Etiket: kutunun üstünde, hep yatay. */
      var pct = Math.round(84 + I.conf * 13 + I.seed * 2);
      var label = 'KIRMIZI 1 · %' + pct;
      ctx.font = '600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
      var tw = ctx.measureText(label).width;
      var bx = x - tw * .5 - 8, by = y - h - 24;
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(5,38,27,.78)';
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(bx, by, tw + 16, 19, 9); ctx.fill(); }
      else ctx.fillRect(bx, by, tw + 16, 19);
      ctx.fillStyle = 'rgba(250,199,51,.95)';
      ctx.fillText(label, bx + 8, by + 13.5);
      ctx.globalAlpha = 1;
    }
  }

  /* ---- 6. Merceğin kendisi ---------------------------------------------- */
  function reticle(t) {
    var R = lens.r, x = lens.x, y = lens.y, a = lens.pow;
    if (a < .02) return;

    ctx.globalCompositeOperation = 'lighter';
    var g = ctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, 'rgba(233,251,241,' + (.09 * a).toFixed(3) + ')');
    g.addColorStop(.5, 'rgba(24,138,94,' + (.06 * a).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';

    /* Sensör ızgarası ve tarama çizgisi — yalnız mercek içinde. */
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, R * .94, 0, 6.2832); ctx.clip();
    ctx.strokeStyle = 'rgba(233,251,241,' + (.05 * a).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var gs = 28;
    for (var gx = x - R - (x % gs); gx < x + R; gx += gs) { ctx.moveTo(gx, y - R); ctx.lineTo(gx, y + R); }
    for (var gy = y - R - (y % gs); gy < y + R; gy += gs) { ctx.moveTo(x - R, gy); ctx.lineTo(x + R, gy); }
    ctx.stroke();

    var sy = y + Math.sin(t * 1.15) * R * .86;
    var lg = ctx.createLinearGradient(x - R, 0, x + R, 0);
    lg.addColorStop(0, 'rgba(250,199,51,0)');
    lg.addColorStop(.5, 'rgba(250,199,51,' + (.5 * a).toFixed(3) + ')');
    lg.addColorStop(1, 'rgba(250,199,51,0)');
    ctx.strokeStyle = lg; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x - R, sy); ctx.lineTo(x + R, sy); ctx.stroke();
    ctx.restore();

    /* Dönen kesik halka */
    ctx.save();
    ctx.setLineDash([5, 11]);
    ctx.lineDashOffset = -t * 26;
    ctx.strokeStyle = 'rgba(233,251,241,' + (.24 * a).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(x, y, R * .94, 0, 6.2832); ctx.stroke();
    ctx.restore();

    /* Simgenin kendi köşe ayraçları, merceğin etrafında */
    ctx.save();
    ctx.translate(x, y); ctx.rotate(Math.sin(t * .25) * .06);
    var h = R * .62, L = h * .34;
    ctx.strokeStyle = 'rgba(255,253,245,' + (.62 * a).toFixed(3) + ')';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    var cs = [[-h, -h, 1, 1], [h, -h, -1, 1], [h, h, -1, -1], [-h, h, 1, -1]];
    for (var c = 0; c < 4; c++) {
      var p = cs[c];
      ctx.moveTo(p[0] + p[2] * L, p[1]); ctx.lineTo(p[0], p[1]); ctx.lineTo(p[0], p[1] + p[3] * L);
    }
    ctx.stroke();
    /* artı imi */
    ctx.strokeStyle = 'rgba(250,199,51,' + (.5 * a).toFixed(3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-9, 0); ctx.lineTo(-3, 0); ctx.moveTo(3, 0); ctx.lineTo(9, 0);
    ctx.moveTo(0, -9); ctx.lineTo(0, -3); ctx.moveTo(0, 3); ctx.lineTo(0, 9);
    ctx.stroke();
    ctx.restore();
  }

  /* ---- 7. Köşedeki sayaç ------------------------------------------------- */
  function hud(fi) {
    if (W < 680) return;
    var locked = 0;
    for (var i = 0; i < insts.length; i++) if (insts[i].conf > .5) locked++;
    ctx.font = '600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(233,251,241,.3)';
    ctx.fillText('TARAMA ALANI · ' + Math.round(n * quality) + ' NOKTA · ' + fi + ' ODAK · ' + locked + ' KİLİT',
      20, H - 18);
  }

  /* ---- 8. Durağan hâl (hareket azaltma açıkken) -------------------------- */
  function still() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    tilesDraw(0, W * .5, H * .5, []);
    var curC = -1;
    for (var k = 0; k < n; k++) {
      var i = ORDER[k];
      if (CI[i] !== curC) { curC = CI[i]; ctx.fillStyle = DUST[curC]; }
      var sz = SZ[i];
      ctx.fillRect(HX[i] - sz * .5, HY[i] - sz * .5, sz, sz);
    }
    cv.classList.add('on');
  }

  /* ---- 9. Bağlantılar ---------------------------------------------------- */
  function onPointer(e) {
    pointerAt = now();
    /* İpucu ilk kıpırtıda kaçmasın: fare bir süre gezdirildikten sonra sönsün. */
    if (lastPX) travel += Math.abs(e.clientX - lastPX) + Math.abs(e.clientY - lastPY);
    lastPX = e.clientX; lastPY = e.clientY;
    lens.tx = e.clientX; lens.ty = e.clientY;
    if (travel > 900 && hint && !hint.classList.contains('gone')) hint.classList.add('gone');
    if (card) {
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    }
  }

  function start() {
    pts = sampleIcon();
    if (!pts) return;                 /* piksel okunamadıysa sayfa sade kalsın */
    makeSprites();
    makeTileSprites();
    resize();
    cv.classList.add('on');

    if (reduce) { still(); return; }

    window.addEventListener('pointermove', onPointer, { passive: true });
    window.addEventListener('pointerdown', function (e) {
      pointerAt = now(); lens.tx = e.clientX; lens.ty = e.clientY;
      wave(e.clientX, e.clientY, .95, 1500);
    }, { passive: true });
    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) onPointer(e.touches[0]);
    }, { passive: true });

    var btns = document.querySelectorAll('a.btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('pointerenter', function (e) {
        var r = e.currentTarget.getBoundingClientRect();
        wave(r.left + r.width / 2, r.top + r.height / 2, .5, 1100);
      });
    }

    var rt = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { resize(); }, 180);
    });

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    });

    /* Açılışta bir kez: alanın tamamı ortadan dışarı doğru tanınıyor. */
    setTimeout(function () { wave(W * .5, H * .45, 1.15, 2300); }, 520);
    raf = requestAnimationFrame(frame);
  }

  if (coarse && hint) document.getElementById('hinttext').textContent = 'Parmağını gezdir — alan taranır';

  if (img.complete && img.naturalWidth) start();
  else img.addEventListener('load', start, { once: true });
})();
</script>
</body>
