<style>
  :root {
    --felt: #127A52;
    --felt-shade: #083D29;
    --felt-deep: #05261B;
    --ivory: #FFFDF5;
    --ivory-shade: #EBE2CD;
    --red: #CB202E;
    --yellow: #FAC733;
    --mint: #E9FBF1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem calc(2rem + env(safe-area-inset-bottom));
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--mint);
    background: radial-gradient(120% 90% at 50% 0%, var(--felt) 0%, var(--felt-shade) 55%, var(--felt-deep) 100%);
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 26rem; text-align: center; }
  .icon {
    width: 108px; height: 108px;
    border-radius: 24px;
    display: block; margin: 0 auto 1.25rem;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .45);
  }
  h1 {
    margin: 0 0 .2rem;
    font-size: 2rem; font-weight: 700; letter-spacing: -.02em;
    color: var(--ivory);
  }
  .sub { margin: 0 0 .35rem; font-size: 1rem; font-weight: 600; color: var(--yellow); }
  .pitch { margin: 0 auto 1.9rem; max-width: 22rem; color: rgba(233, 251, 241, .82); }
  .stores { display: flex; flex-direction: column; gap: .7rem; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    padding: .95rem 1.1rem;
    border-radius: 14px;
    font-size: 1.02rem; font-weight: 600;
    text-decoration: none;
    background: var(--ivory); color: #0d2a1e;
    border: 1px solid var(--ivory-shade);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  a.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(0, 0, 0, .3); }
  a.btn:active { transform: translateY(0); }
  a.btn svg { width: 22px; height: 22px; flex: none; }
  footer { margin-top: 2.6rem; font-size: .82rem; color: rgba(233, 251, 241, .5); }
  footer a { color: rgba(233, 251, 241, .72); }
  footer a:hover { color: var(--ivory); }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
